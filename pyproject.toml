[project]
name = "FMDV_immune_dynamics"
authors = [
    {name = "Jan Medlock", email = "medlockj@oregonstate.edu"},
    {name = "et alia"},
]
maintainers = [
    {name = "Jan Medlock", email = "medlockj@oregonstate.edu"},
]
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
version = "1.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    # Simulation core
    "numpy>=2.4.6,<2.5",
    "scipy>=1.17.1,<1.18",
    "sortedcontainers>=2.4.0,<2.5",
    "pandas>=2.3.3,<2.4",
    "tables>=3.11.1,<3.12",
    "joblib>=1.5.3,<1.6",
    "psutil>=7.2.2,<7.3",
    # Plotting and other post-processing
    "matplotlib>=3.10.9,<3.11", # +dfsg1
    "seaborn>=0.13.2,<0.14",
    "statsmodels>=0.15.0,<0.16", # +dfsg
    "astropy>=8.0.2,<8.1",
]

[project.urls]
source = "https://github.com/janmedlock/FMDV_immune_dynamics.git"

[project.optional-dependencies]
# Speed finding initial conditions in 'herd/_floquet/'
cython = [
    "cython>=3.1.6,<3.2",
]
# Notebook in 'test/'
jupyter = [
    "ipykernel",
    "notebook",
]
ipython = [
    "ipython",
]

[tool.setuptools]
packages = [
    "data",
    "herd",
    "inference",
    "test",
]

[tool.uv]
package = false
exclude-newer = "1 week"

[tool.uv.audit]
malware-check = true
